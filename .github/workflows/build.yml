name: Build Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (win-x64, self-contained single file)
        run: dotnet publish src/DesktopOrganizer.Wpf/DesktopOrganizer.Wpf.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopOrganizer
          path: publish/DesktopOrganizer.exe
